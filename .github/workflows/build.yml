name: ts-sdk Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"

      - run: bun install
      - run: bun run build
